services:
  serving:
    image: ocr-agent:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["mcp"]
    ports:
      - "5290:8080"

  # Opt-in because this service consumes messages from the configured queue.
  # Run it only with: docker compose --profile worker up worker
  worker:
    profiles: ["worker"]
    image: ocr-agent:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["worker"]
    environment:
      WorkerOptions__StorageConnectionString: "${WORKER_STORAGE_CONNECTION_STRING:-${AZURE_STORAGE_CONNECTION_STRING:-}}"
      WorkerOptions__TrainingContainer: "${WorkerOptions__TrainingContainer:-training-files}"
      WorkerOptions__ResultContainer: "${WorkerOptions__ResultContainer:-result-files}"
      WorkerOptions__ResultTable: "${WorkerOptions__ResultTable:-results}"
      WorkerOptions__Queue: "${WorkerOptions__Queue:-trigger-queue}"
      WorkerOptions__GroupId: "${WorkerOptions__GroupId:-AgenticDocumentOcr}"
      WorkerOptions__WorkRoot: "/var/ocr/worker"
      WorkerOptions__MessageVisibilityTimeoutSeconds: "${WorkerOptions__MessageVisibilityTimeoutSeconds:-900}"
      WorkerOptions__EnsureStorageResources: "true"
      OCR_Storage__Provider: "local"
      OCR_Runs__Provider: "none"
