services:
  sftp-server:
    image: atmoz/sftp:latest
    container_name: ocragent-sftp-dev
    ports:
      - "2222:22"
    # Uncomment to use SSH keys instead of password
    # volumes:
    #   - ./ssh-keys:/home/ocragent/.ssh/keys:ro
    command: ocragent:${SFTP_PASSWORD}:1001:100:ocr
    environment:
      - SFTP_USERS=ocragent:${SFTP_PASSWORD}:1001:100:ocr
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ocragent-network

networks:
  ocragent-network:
    driver: bridge
